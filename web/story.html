<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ハックツの伝説 時のオカリナ - はじまり</title>
<link rel="stylesheet" href="style.css">
<style>
  #story-text {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    width: 84%;
    max-width: 640px;
    box-sizing: border-box;
    text-align: left;
    padding: 20px 24px;
    background: rgba(20, 25, 40, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 4px;
  }
  #story-text h1 {
    font-size: 18px;
    font-weight: normal;
    letter-spacing: 0.1em;
    margin: 0 0 12px;
    color: #fff;
    text-align: center;
  }
  #story-text p {
    font-size: 13px;
    color: #eee;
    line-height: 1.8;
    margin: 0 0 12px;
  }
  #story-text h2 {
    font-size: 13px;
    font-weight: normal;
    color: #fff;
    margin: 16px 0 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding-top: 12px;
  }
  #story-text ul {
    margin: 0 0 12px;
    padding-left: 1.2em;
    font-size: 12px;
    color: #ccc;
    line-height: 1.7;
  }
  #story-text .hint {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin: 0;
  }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <div id="story-text">
    <h1>ハックツの伝説 時のオカリナ</h1>
    <p>
      平和だった大地に、ある日ガノンが現れた。<br>
      オカリナを託された主人公は、神殿フィールドから草原を抜け、
      玉座の間、そして戦場跡の先にいるガノンを倒し、ゼルダを助ける旅に出る。
    </p>
    <h2>操作方法</h2>
    <ul>
      <li>MIDIキーボードまたはオタマトーン(マイク)でオカリナを演奏する</li>
      <li>音の高さ(ピッチ)で前進・後退する</li>
      <li>決められたメロディを演奏すると、扉が開いたり天候が変わったりする</li>
      <li>キーボード操作でも代用できる(矢印キー: 移動、Oキー: メロディ演奏の代用)</li>
    </ul>
    <p class="hint">「ド」を演奏する(またはOキー)と、神殿フィールドへ進みます。</p>
  </div>
</div>

<h3>MIDI入力</h3>
<div id="midi-status"></div>

<h3>オカリナの音</h3>
<div id="audio-controls">
  <button id="btn-enable-audio">音を有効にする(初回にクリック)</button>
</div>

<script src="wasm_exec.js"></script>
<script src="audio.js"></script>
<script src="midi-input.js"></script>
<script src="story.js"></script>

</body>
</html>
