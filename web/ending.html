<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ハックツの伝説 時のオカリナ - エンディング</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    justify-content: center;
    min-height: 100vh;
    padding-bottom: 0;
    background: #000;
  }
  #ending {
    text-align: center;
    opacity: 0;
    animation: fade-in 2.5s ease-out forwards;
  }
  #ending h1 {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 0.15em;
    margin-bottom: 16px;
  }
  #ending p {
    font-size: 13px;
    color: #aaa;
    line-height: 1.8;
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div id="ending">
  <h1>ガノンは、ついに倒れた。</h1>
  <p>
    嵐は去り、静寂が戦場跡を包む。<br>
    ハックツの伝説 時のオカリナ - おわり
  </p>
</div>

</body>
</html>
