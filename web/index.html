<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Okarina</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="status">Go WASM を読み込み中...</div>
<canvas id="game-canvas" width="800" height="600"></canvas>

<div id="bridge-controls">
  <button id="btn-ping" disabled>JS→Go: goPing() を呼ぶ</button>
  <button id="btn-midi" disabled>JS→Go: MIDIイベントを送る(テスト)</button>
</div>
<div id="bridge-log"></div>

<h3>MIDI入力</h3>
<div id="midi-status"></div>

<h3>オカリナの音</h3>
<div id="audio-controls">
  <button id="btn-enable-audio">音を有効にする(初回にクリック)</button>
  <button id="btn-test-sound">テスト再生</button>
</div>

<script src="wasm_exec.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>

</body>
</html>
