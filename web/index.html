<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Okarina - タイトル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="status">Go WASM を読み込み中...</div>
<canvas id="game-canvas" width="800" height="600"></canvas>

<h2 style="color: #7CFC9A;">Okarina(仮タイトル)</h2>
<p style="font-size: 13px; color: #aaa;">
  MIDIキーボードで「ド(C)」を弾くと神殿フィールドへ進みます。<br>
  中身はまだ仮です。今後ここにタイトル画面らしい見た目を追加していきます。
</p>

<h3>MIDI入力</h3>
<div id="midi-status"></div>

<h3>オカリナの音</h3>
<div id="audio-controls">
  <button id="btn-enable-audio">音を有効にする(初回にクリック)</button>
</div>

<script src="wasm_exec.js"></script>
<script src="audio.js"></script>
<script src="midi-input.js"></script>
<script src="title.js"></script>

</body>
</html>
