<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Okarina - 草原フィールド</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="canvas-wrap">
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <div id="grassland-melody-hint" class="field-hint">馬の歌を吹き、馬とともに障害物を乗り越えろ!</div>
  <div id="grassland-jump-hint" class="field-hint" hidden>低い音を鳴らしてジャンプ!</div>
</div>

<p class="field-note">
  <a href="temple.html">神殿フィールドに戻る</a>
</p>

<h3>MIDI入力</h3>
<div id="midi-status"></div>

<h3>オカリナの音</h3>
<div id="audio-controls">
  <button id="btn-enable-audio">音を有効にする(初回にクリック)</button>
  <button id="btn-test-sound">テスト再生</button>
</div>

<h3>オタマトーンでLinkを移動</h3>
<div id="mic-pitch-status">マイクは未接続です</div>
<button id="btn-start-mic-pitch">マイクを開始</button>
<div id="mic-pitch-info">
  <span id="mic-pitch-value">-- Hz</span>
  <span id="mic-direction">停止</span>
</div>
<div id="mic-threshold-row">
  <label for="mic-threshold-slider">しきい値</label>
  <input type="range" id="mic-threshold-slider" min="-60" max="-10" value="-30" step="1">
  <span id="mic-threshold-value">-30 dB</span>
</div>

<h3>デバッグ操作</h3>
<div id="debug-status">矢印キー(→:前進 / ←:後退)でもLinkを動かせます(マイク不要)</div>
<div id="debug-controls">
  <button id="btn-summon-horse">馬に乗る(テスト)</button>
</div>

<script src="wasm_exec.js"></script>
<script src="audio.js"></script>
<script src="midi-input.js"></script>
<script src="pitch.js"></script>
<script src="mic-pitch.js"></script>
<script src="debug-keys.js"></script>
<script src="grassland.js"></script>
<script>
  // 「馬の歌」を演奏しなくても、馬に乗った状態(横視点カメラへの切り替え
  // 含む)を試せるデバッグ用ボタン(ganon-hall.htmlのbtn-preview-collapse等と
  // 同様の仮実装パターン)。
  document.getElementById('btn-summon-horse').addEventListener('click', () => {
    window.goSummonHorse();
  });
</script>

</body>
</html>
